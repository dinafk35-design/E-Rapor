name: Deploy Aplikasi TODO LIST ke Infinityfree via FTP

# Action ini akan berjalan otomatis setiap ada push ke branch main/master
on:
  push:
    branches:
      - master

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode terbaru dari repository
    - name: Get latest code
      uses: actions/checkout@v4

    # 2. Menyiapkan environment PHP di GitHub Server
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3' # Sesuaikan dengan versi PHP Anda

    # 3. Menginstal package Laravel (vendor)
    - name: Install Dependencies
      timeout-minutes: 15
      run: composer install --optimize-autoloader --no-dev

    # 4. Mengirim file ke server InfinityFree via FTP
    - name: Sync files via FTP
      timeout-minutes: 15
      uses: SamKirkland/FTP-Deploy-Action@v4.3.3
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        server-dir: /htdocs/
        # Mengecualikan file yang tidak perlu diupload
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          **/vendor/**
          .env.example
          README.md
          tests/**
          .agent/
          .docs/